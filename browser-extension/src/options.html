<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>zjx-download 设置</title><link rel="stylesheet" href="ui.css"></head><body><main><header><img src="icons/icon-48.png"><div><h1>zjx-download 设置</h1><p>权限按功能申请。关闭自动接管后，Chrome 保留原下载流程。</p></div></header><section><h2>连接</h2><label>本机 API 端口 <input id="port" type="number" min="1024" max="65535"></label><label>API Key <input id="apiKey" type="password" autocomplete="off"></label><button id="check">检查连接</button><span id="connection"></span><h2>自动接管</h2><label><input id="autoCapture" type="checkbox"> 接管符合条件的浏览器文件下载</label><label><input id="minimumSizeKB" type="number" min="0"> 最小文件大小（KB，0 不限）</label><label>扩展名（逗号分隔）<input id="extensions"></label><label>忽略规则（每行一个 URL 模式）<textarea id="ignoredPatterns" rows="4"></textarea></label><label><input id="closeCapturedTab" type="checkbox"> 确认 App 接收后关闭匹配的新下载标签页</label><h2>手动与媒体</h2><label><input id="showPageWidgets" type="checkbox"> 显示选区与媒体候选</label><label><input id="sendRequestHeaders" type="checkbox"> 转交观察到的 Cookie 和请求头</label><button id="headerPermission" class="secondary">申请请求头权限</button><label>绕过键 <input id="bypassKey"></label><h2>添加方式</h2><label><input id="silentAdd" type="checkbox"> 静默添加</label><label><input id="silentStart" type="checkbox"> 静默添加后立即开始</label><button id="save">保存设置</button><p id="result" role="status"></p></section><script type="module" src="options.js"></script></main></body></html>
