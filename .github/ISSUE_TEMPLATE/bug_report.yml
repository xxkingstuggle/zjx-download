name: 🐞 Bug Report
description: Report an issue or unexpected behavior in the app
title: "[Bug] Brief summary (keep it short)"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug!
        ### Before submitting
        - Search the existing [issues](https://github.com/xxkingstuggle/zjx-download/issues) to check whether this has already been reported.
        - Read the [Contributing guidelines](https://github.com/xxkingstuggle/zjx-download/blob/main/CONTRIBUTING.md#bug-reports) for bug reporting requirements.
  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: What happened? What were you trying to do? Please provide a clear and concise description of the problem.
      placeholder: Describe the bug you encountered.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: 🏷️ App Version
      description: App version/build and Chrome extension version/ID, if relevant
      placeholder: "2.0.2 / 20261023.1; Chrome extension 2.0.1"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 💻 Platform
      description: macOS version and Chrome version, if relevant
      placeholder: "macOS 26.x; Chrome version"
    validations:
      required: true
  - type: input
    id: installation-type
    attributes:
      label: 📦 Installation Type (optional)
      description: App bundle source and unpacked Chrome extension source, if relevant
      placeholder: "Local signed App bundle"
    validations:
      required: false
  - type: input
    id: system-device-details
    attributes:
      label: ⚙️ System/Device Details (optional)
      description: e.g., CPU, RAM, device model
      placeholder: "MacBook Pro (Apple M4); RAM: 16GB"
    validations:
      required: false
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 🔁 Steps to Reproduce
      description: List all necessary steps to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: ✅ Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 📷 Screenshots or Recordings (optional)
      description: Drag and drop, paste images, or attach screen recordings here.
      placeholder: Attach screenshots or screen recordings if possible.
    validations:
      required: false
  - type: textarea
    id: additional-info
    attributes:
      label: 🗒️ Additional Information (optional)
      description: Any additional info, logs, context, or links to related issues.
      placeholder: Add any other context about the problem here.
    validations:
      required: false
  - type: textarea
    id: possible-solution
    attributes:
      label: 💡 Possible Solution (optional)
      description: Suggest a fix or reason for the bug, if you have one.
      placeholder: Suggest a possible solution or reason for the bug.
    validations:
      required: false
