name: macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    env:
      APP_NAME: zjx-download.app
      ZIP_NAME: zjx-download-macOS.zip
      DERIVED_DATA: ${{ github.workspace }}/.build/release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project zjx-download.xcodeproj \
            -scheme zjx-download \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS='arm64 x86_64' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY='-' \
            build

      - name: Ad-hoc sign nested Mach-O files and app
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME"
          test -d "$APP"

          # Xcode signs embedded frameworks and helpers inside-out with the
          # same ad-hoc identity. Re-sign the outer app explicitly as the
          # final step, then verify the complete bundle recursively.
          /usr/bin/codesign --force --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package app
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" "artifacts/$ZIP_NAME"
          unzip -t "artifacts/$ZIP_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zjx-download-macOS
          path: artifacts/zjx-download-macOS.zip
          if-no-files-found: error

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/zjx-download-macOS.zip
          generate_release_notes: true
