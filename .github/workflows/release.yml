name: macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    env:
      APP_NAME: AB Download Manager.app
      ZIP_NAME: AB-Download-Manager-macOS.zip
      DERIVED_DATA: ${{ github.workspace }}/.build/release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ABDownloadManager.xcodeproj \
            -scheme ABDownloadManager \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS='arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign nested Mach-O files and app
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME"
          test -d "$APP"

          sign_file() {
            local path="$1"
            if file "$path" | grep -q 'Mach-O'; then
              codesign --force --sign - --timestamp=none "$path"
            fi
          }

          while IFS= read -r -d '' path; do
            sign_file "$path"
          done < <(find "$APP/Contents" -type f -print0)

          while IFS= read -r -d '' bundle; do
            codesign --force --sign - --timestamp=none "$bundle"
          done < <(find "$APP/Contents" -type d \( -name '*.framework' -o -name '*.xpc' -o -name '*.appex' \) -print0 | sort -zr)

          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package app
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" "artifacts/$ZIP_NAME"
          unzip -t "artifacts/$ZIP_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AB-Download-Manager-macOS
          path: artifacts/AB-Download-Manager-macOS.zip
          if-no-files-found: error

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/AB-Download-Manager-macOS.zip
          generate_release_notes: true
